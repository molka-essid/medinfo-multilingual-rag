[project]
name = "medinfo-multilingual-rag"
version = "0.1.0"
description = "Multilingual (AR/FR/EN) health information assistant using RAG"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "langgraph>=0.1",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "groq>=0.9",
  "google-generativeai>=0.7",
  "langdetect>=1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "tqdm>=4.66",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
